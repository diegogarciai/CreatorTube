name: iOS

# Solo corre cuando cambia apps/ios. La lógica (PlanificadorCore) se prueba en
# Linux, que es barato; la app completa se compila en macOS sin firmar, y solo
# en los PR: un minuto de macOS cuenta como 10 de Linux, y en main ya compila
# Xcode Cloud. El push corre solo en main (en una rama con PR ya corre el PR).
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: apps/ios/PlanificadorCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  app:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    needs: core
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      # El mismo script que corre Xcode Cloud: arma Secrets.xcconfig, genera el
      # proyecto y resuelve los paquetes. Aquí con valores de prueba.
      - name: Preparar como Xcode Cloud
        env:
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_ANON_KEY: ci
        run: ci_scripts/ci_post_clone.sh
      # Xcode Cloud solo usa las versiones de apps/ios/Package.resolved. Aquí se
      # resuelve igual que allá; si falla, se muestra el archivo que hace falta.
      - name: Resolver paquetes como Xcode Cloud
        run: |
          resolved=Planificador.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if ! cmp -s Package.resolved "$resolved" || ! xcodebuild -resolvePackageDependencies \
              -project Planificador.xcodeproj -scheme Planificador \
              -disableAutomaticPackageResolution; then
            echo "apps/ios/Package.resolved falta o está desactualizado. Este es el que generó el CI:"
            cat "$resolved"
            exit 1
          fi
      # En Release, como el archivo que se sube a TestFlight.
      - name: Compilar para el simulador
        run: |
          set -o pipefail
          xcodebuild build \
            -project Planificador.xcodeproj \
            -scheme Planificador \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Revisar lo que pide App Store Connect
        run: |
          app=build/Build/Products/Release-iphonesimulator/Planificador.app
          test -f "$app/PrivacyInfo.xcprivacy" || { echo "Falta PrivacyInfo.xcprivacy en la app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$app/Info.plist"

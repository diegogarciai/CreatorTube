name: Trigger.dev deploy

# Despliega las tareas de apps/jobs en el entorno Production de Trigger.dev.
# Secreto: TRIGGER_ACCESS_TOKEN = API key del entorno Production con acceso
# "Deploy only" (Trigger.dev → API keys). Ver docs/configurar-trigger.md.
on:
  push:
    branches: [main]
    paths:
      - "apps/jobs/**"
      - "packages/ai/**"
      - "packages/core/**"
      - "packages/db/src/**"
      - "packages/motion/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/trigger-deploy.yml"
  workflow_dispatch:

concurrency:
  group: trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar el secreto
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto TRIGGER_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # El bundle de Remotion (piezas animadas) viaja con el despliegue.
      - name: Armar el bundle de Remotion
        run: pnpm --filter @planificador/motion build
      - name: Desplegar en Trigger.dev
        working-directory: apps/jobs
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm exec trigger deploy
